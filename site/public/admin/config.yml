# Website editor (Sveltia CMS) for Embrace Movement Clinic, served at /admin.
# Staff edit content here. Claude Code handles layout and design.
# Each save is a commit to the branch below, and Cloudflare Pages republishes the site in a minute or two.
# Field names match the content schema in site/src/content.config.ts. Keep the two in step.

backend:
  name: github
  repo: AdrianPow/embracemovementclinic
  # Demo: the preview branch. Change to `main` at launch.
  branch: claude/tender-mayer-vvk5i5
  # "Sign in with GitHub" needs a small login helper (a Cloudflare Worker). Until it's set up,
  # sign in with a GitHub access token instead. See docs/editing.md.
  # base_url: https://embrace-cms-auth.<your-account>.workers.dev

site_url: https://www.embracemovementclinic.com.au
logo:
  src: /icon-192.png

# Leave out optional fields that are blank, instead of saving empty text.
output:
  omit_empty_optional_fields: true

# Photos. Uploads are converted to WebP and scaled down to 3000 px wide in the browser before
# they're saved, so photos straight off a phone are fine. The site makes the smaller sizes itself.
media_folder: site/src/assets/photos
public_folder: /src/assets/photos
media_libraries:
  default:
    config:
      max_file_size: 40000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 3000

slug:
  encoding: ascii
  clean_accents: true

collections:
  # ── Services ──────────────────────────────────────────────────────────────
  - name: services
    label: Services
    editor: { preview: false } # the site itself is the preview: changes show there a minute or two after saving
    label_singular: Service
    description: >-
      One page per service. This is regulated health advertising: no testimonials, no promises of
      results, and changes to clinical wording (conditions, what a service involves, examination or
      consent wording) need owner approval.
    folder: site/src/content/services
    extension: md
    format: frontmatter
    create: false
    delete: false
    identifier_field: title
    sortable_fields: [order, title]
    media_folder: ../../assets/photos
    public_folder: ../../assets/photos
    fields:
      - { name: title, label: Page title, widget: string }
      - { name: shortTitle, label: Short name, widget: string, required: false, hint: 'Used in the menu, e.g. "Physiotherapy".' }
      - { name: order, label: Order in lists, widget: number, value_type: int, hint: '1 shows first.' }
      - name: kind
        label: Type
        widget: select
        readonly: true
        options:
          - { label: One-on-one appointment, value: appointment }
          - { label: Small group classes, value: class }
      - name: image
        label: Photo
        widget: image
        required: false
        hint: Shown at the top of the page and on its card.
      - { name: imageAlt, label: Photo description, widget: string, required: false, hint: 'What the photo shows, for people using screen readers. E.g. "A physiotherapist treating a patient’s neck".' }
      - name: imagePosition
        label: Photo focus
        widget: focus
        required: false
        image_field: image
        default_focus: 50% 50%
        shapes:
          - { label: Page header, ratio: 4 / 3 }
          - { label: Card, ratio: 3 / 2 }
          - { label: Card on a phone, ratio: 3 / 5 }
          - { label: Pilates card on a computer, ratio: 9 / 16 }
          - { label: Pilates card on a tablet, ratio: 2 / 1 }
        hint: Click the part of the photo to keep in view (e.g. faces), and check the previews. Reset uses the centre.
      - name: blurb
        label: Home page card (15 words or fewer)
        widget: text
        required: false
        pattern: ['^\s*(\S+\s+){0,14}\S+\s*$', 'Keep it to 15 words or fewer.']
      - { name: summary, label: Card summary, widget: text, hint: 'One or two sentences, used on cards elsewhere on the site.' }
      - { name: lede, label: Opening line, widget: text, hint: Shown under the page title. }
      - name: forYou
        label: Is this for you?
        widget: object
        fields:
          - { name: heading, label: Heading, widget: string }
          - { name: intro, label: Intro, widget: string, required: false }
          - name: items
            label: Conditions or reasons
            label_singular: item
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: detail, label: Detail, widget: text, required: false }
      - name: expect
        label: What to expect
        widget: object
        fields:
          - { name: text, label: Text, widget: text, required: false, hint: 'Keep consent or examination wording word for word unless the owner has approved a change.' }
          - name: steps
            label: Steps
            label_singular: step
            widget: list
            required: false
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Step, widget: string }
              - { name: detail, label: Detail, widget: text, required: false }
      - name: treatments
        label: Treatment may include
        widget: object
        required: false
        fields:
          - { name: heading, label: Heading, widget: string, default: Treatment may include }
          - name: items
            label: Treatments
            label_singular: treatment
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: detail, label: Detail, widget: text, required: false }
      - name: goodToKnow
        label: Good to know
        label_singular: note
        widget: list
        required: false
        summary: '{{fields.name}}'
        fields:
          - { name: name, label: Title, widget: string }
          - { name: detail, label: Detail, widget: text }
      - name: practitioners
        label: Who you’ll see
        widget: relation
        collection: team
        value_field: '{{slug}}'
        search_fields: [name]
        display_fields: [name]
        multiple: true
      - { name: practitionersNote, label: Note about who you’ll see, widget: string, required: false }
      - { name: notice, label: Availability note, widget: string, required: false, hint: 'Shown under the page title, e.g. "Available again from April 2027, when Laura returns from leave." Leave blank when not needed.' }
      - name: related
        label: Related services
        widget: relation
        collection: services
        value_field: '{{slug}}'
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
      - { name: imageNote, label: Photo still to come (note), widget: string, required: false, hint: Only used while there’s no photo. }
      - { name: seoTitle, label: Title in Google results, widget: string, pattern: ['^.{1,40}$', 'Keep it to 40 characters or fewer (the clinic name is added after it)'], hint: 'About 35 characters, e.g. "Physiotherapy in McDowall". " | Embrace Movement Clinic" is added after it.' }
      - { name: seoDescription, label: Description in Google results, widget: text }
      - { name: oldUrl, label: Old Squarespace address, widget: string, required: false, readonly: true, hint: Redirected to this page. }
      - { name: body, label: About (optional extra text), widget: markdown, required: false, editor_components: [], hint: Text only. The photo goes in the Photo field above. }

  # ── Team ──────────────────────────────────────────────────────────────────
  - name: team
    label: Team
    editor: { preview: false } # the site itself is the preview: changes show there a minute or two after saving
    label_singular: Practitioner
    description: One profile per practitioner. Titles and qualifications must match the practitioner’s AHPRA registration.
    folder: site/src/content/team
    extension: md
    format: frontmatter
    create: true
    delete: false
    identifier_field: name
    slug: '{{fields.name}}'
    sortable_fields: [order, name]
    media_folder: ../../assets/photos
    public_folder: ../../assets/photos
    fields:
      - { name: name, label: Full name, widget: string }
      - { name: firstName, label: First name, widget: string, hint: 'Used in "Book with …".' }
      - { name: order, label: Order on the team page, widget: number, value_type: int, hint: '1 shows first.' }
      - name: photo
        label: Headshot
        widget: image
        required: false
        hint: A portrait with a little space above the head works best.
      - name: photoPosition
        label: Photo focus
        widget: focus
        required: false
        image_field: photo
        default_focus: 50% 0%
        shapes:
          - { label: Home and Team page cards, ratio: 4 / 3 }
          - { label: Profile page, ratio: 4 / 5 }
          - { label: Service pages, ratio: 1 / 1 }
        hint: Click where to keep in view. For headshots, keep the whole head in every preview. Reset keeps the top of the photo.
      - { name: status, label: Status, widget: string, required: false, hint: 'Shown on the card, e.g. "On maternity leave until January 2027". Leave blank when not needed.' }
      - name: titles
        label: Titles
        widget: list
        hint: Must match the practitioner’s AHPRA registration.
      - { name: education, label: Qualifications, widget: list, required: false }
      - { name: postgradTraining, label: Postgraduate training, widget: list, required: false }
      - { name: experienceHeading, label: Experience heading, widget: string, default: Experience }
      - { name: experience, label: Experience, widget: list, required: false }
      - { name: photoNote, label: Photo still to come (note), widget: string, required: false }
      - { name: seoDescription, label: Description in Google results, widget: text }
      - { name: body, label: Bio, widget: markdown, editor_components: [], hint: Text only. The headshot goes in the Photo field above. }

  # ── News ──────────────────────────────────────────────────────────────────
  - name: news
    label: News
    editor: { preview: false } # the site itself is the preview: changes show there a minute or two after saving
    label_singular: News post
    description: >-
      Clinic updates. No offers without clear terms, and no patient stories about treatment results.
      Don't delete the Christmas 2024, June 2025 or July 2026 posts: old addresses and the notice banner link to them.
    folder: site/src/content/news
    extension: md
    format: frontmatter
    create: true
    delete: true
    identifier_field: title
    slug: '{{fields.title}}'
    sortable_fields: [date, title]
    media_folder: ../../assets/photos
    public_folder: ../../assets/photos
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, format: 'YYYY-MM-DD' }
      - { name: summary, label: Summary, widget: text, hint: One or two sentences for the news list. }
      - { name: archivedNote, label: Archived note, widget: text, required: false, hint: 'For old posts, e.g. "This update is from June 2025…".' }
      - name: images
        label: Photos
        label_singular: photo
        widget: list
        required: false
        fields:
          - { name: src, label: Photo, widget: image }
          - { name: alt, label: Photo description, widget: string }
          - { name: position, label: Photo focus, widget: string, required: false, pattern: ['^[0-9]{1,3}% [0-9]{1,3}%$', 'Two percentages, e.g. 50% 30%'], hint: 'Which part to keep in view: across, then down. E.g. "50% 30%" keeps the upper middle. Leave blank for the centre.' }
      - { name: imageNotes, label: Photos still to come (notes), widget: list, required: false }
      - { name: oldUrl, label: Old Squarespace address, widget: string, required: false, readonly: true }
      - { name: body, label: Post, widget: markdown, editor_components: [], hint: Text only. Add photos under Photos above. }

  # ── Home page ─────────────────────────────────────────────────────────────
  - name: home
    label: Home page
    editor: { preview: false } # the site itself is the preview: changes show there a minute or two after saving
    description: The home page headline, intro and photos. Service cards come from Services; team cards from Team.
    files:
      - name: home
        label: Home page
        file: site/src/content/home/home.md
        format: frontmatter
        media_folder: ../../assets/photos
        public_folder: ../../assets/photos
        fields:
          - { name: heroTitle, label: Headline, widget: string }
          - { name: heroIntro, label: Intro, widget: text, hint: One sentence. }
          - { name: heroImage, label: Main photo, widget: image }
          - { name: heroImageAlt, label: Main photo description, widget: string }
          - name: heroImagePosition
            label: Main photo focus
            widget: focus
            required: false
            image_field: heroImage
            default_focus: 50% 50%
            shapes:
              - { label: Computer, ratio: 1 / 1 }
              - { label: Phone, ratio: 4 / 3 }
            hint: Click the part of the photo to keep in view, and check both previews.
          - name: facts
            label: Facts under the headline
            widget: list
            max: 4
            required: false
            hint: 'Up to four short lines. Their icons go in order: person, group, shield, map pin.'
          - name: steps
            label: How it works (one line per step)
            widget: list
            min: 1
            max: 4
          - { name: teamIntro, label: Team intro, widget: text }
          - name: approach
            label: Our approach
            widget: object
            fields:
              - { name: text, label: Values line, widget: text }
              - { name: image, label: Large photo, widget: image }
              - { name: imageAlt, label: Large photo description, widget: string }
              - { name: insetImage, label: Small overlapping photo, widget: image }
              - { name: insetImageAlt, label: Small photo description, widget: string }
              - name: insetImagePosition
                label: Small photo focus
                widget: focus
                required: false
                image_field: approach.insetImage
                default_focus: 50% 50%
                shapes:
                  - { label: Small photo, ratio: 3 / 4 }
                hint: Click the part of the photo to keep in view.

  # ── Pages ─────────────────────────────────────────────────────────────────
  - name: pages
    label: Pages
    editor: { preview: false } # the site itself is the preview: changes show there a minute or two after saving
    description: Text on the Team, Patient information, Contact and Services pages. Service, practitioner and news content are in their own sections.
    files:
      - name: team
        label: Team page
        file: site/src/content/pages/team.md
        format: frontmatter
        media_folder: ../../assets/photos
        public_folder: ../../assets/photos
        fields:
          - { name: intro, label: Intro, widget: text }
          - name: jeff
            label: Jeff, the clinic dog
            widget: object
            hint: Also used on Patient information.
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: extra, label: Extra line, widget: string, required: false }
              - { name: photo, label: Photo, widget: image }
              - { name: photoAlt, label: Photo description, widget: string }
              - name: photoPosition
                label: Photo focus
                widget: focus
                required: false
                image_field: jeff.photo
                default_focus: 50% 50%
                shapes:
                  - { label: Team page, ratio: 1 / 1 }
                hint: Click the part of the photo to keep in view.
      - name: patient-information
        label: Patient information
        file: site/src/content/pages/patient-information.md
        format: frontmatter
        fields:
          - { name: intro, label: Intro, widget: text }
          - name: firstVisit
            label: Your first visit (paragraphs)
            label_singular: paragraph
            widget: list
            field: { name: paragraph, label: Paragraph, widget: text }
            hint: A sentence linking to the service pages is added after the first paragraph.
          - name: whatToBring
            label: What to bring
            label_singular: item
            widget: list
            required: false
            hint: One item per line, e.g. "Your private health fund card". Leave empty until confirmed; the page shows a note instead.
          - name: fees
            label: Fees
            label_singular: fee
            widget: list
            required: false
            summary: '{{fields.group}} · {{fields.item}}: {{fields.price}}'
            hint: Keep these the same as the prices on the Nookal booking page (GST included). Fees with the same group are listed together, in this order.
            fields:
              - { name: group, label: Group, widget: string, required: false, hint: 'The service it belongs to, e.g. "Physiotherapy".' }
              - { name: item, label: Appointment or class, widget: string, hint: 'E.g. "Initial consultation (45 minutes)".' }
              - { name: price, label: Price, widget: string, hint: 'E.g. "$120".' }
              - { name: note, label: Note, widget: string, required: false }
          - name: feeNotes
            label: Rebates and packages
            label_singular: note
            widget: list
            required: false
            field: { name: note, label: Note, widget: text }
            hint: Check these are still current (e.g. class packages). No offers without their terms.
          - name: funding
            label: Medicare, DVA, NDIS and WorkCover
            label_singular: line
            widget: list
            required: false
            field: { name: line, label: Line, widget: text }
            hint: Only what the clinic accepts. Leave empty until confirmed; the page shows a note instead.
          - { name: privacy, label: Your privacy (summary), widget: text }
      - name: contact
        label: Contact page
        file: site/src/content/pages/contact.md
        format: frontmatter
        fields:
          - { name: intro, label: Intro, widget: text }
          - { name: callNote, label: Note under Call, widget: string }
          - { name: textNote, label: Note under Text, widget: string }
          - { name: emailNote, label: Note under Email, widget: string }
          - { name: bookNote, label: Note under Book online, widget: string }
      - name: services
        label: Services page
        file: site/src/content/pages/services.md
        format: frontmatter
        fields:
          - { name: intro, label: Intro, widget: text }
          - { name: helpIntro, label: '"What can we help with?" intro', widget: string }
          - { name: servicesIntro, label: '"Our services" intro', widget: string }

  # ── Clinic settings ───────────────────────────────────────────────────────
  - name: settings
    label: Clinic settings
    editor: { preview: false } # the site itself is the preview: changes show there a minute or two after saving
    description: Contact details, hours, the notice banner, policies, the class timetable and the "What can we help with?" groups.
    files:
      - name: clinic
        label: Clinic details
        file: site/src/data/clinic.json
        format: json
        fields:
          - { name: phone, label: Phone, widget: string, hint: 'Shown as typed, e.g. "0434 686 261". Tap-to-call links are made from it.' }
          - { name: email, label: Email, widget: string, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Enter an email address.'] }
          - name: hours
            label: Opening hours
            label_singular: row
            widget: list
            required: false
            hint: Leave empty until the reopening hours are set; the site shows a note instead.
            summary: '{{fields.days}}: {{fields.hours}}'
            fields:
              - { name: days, label: Days, widget: string, hint: 'E.g. "Monday" or "Tuesday to Thursday".' }
              - { name: hours, label: Hours, widget: string, hint: 'E.g. "6am – 3pm" or "Closed".' }
          - name: notice
            label: Notice banner
            widget: object
            hint: The strip at the top of every page.
            fields:
              - { name: enabled, label: Show the banner, widget: boolean }
              - { name: message, label: Message, widget: text }
              - { name: linkLabel, label: Link text, widget: string, required: false }
              - { name: linkHref, label: Link address, widget: string, required: false, pattern: ['^(/|https://)', 'Start with / for a page on this site (e.g. /news/july-2026-update), or https:// for another site'], hint: 'A page on the site, e.g. `/news/july-2026-update`.' }
              - { name: until, label: Hide automatically after, widget: datetime, time_format: false, format: 'YYYY-MM-DD', required: false }
          - { name: instagram, label: Instagram profile link, widget: string, required: false, pattern: ['^https://', 'Paste the full link, starting with https://'] }
          - { name: facebook, label: Facebook page link, widget: string, required: false, pattern: ['^https://', 'Paste the full link, starting with https://'] }
          - { name: abn, label: ABN, widget: string, required: false }
          - { name: parking, label: Parking, widget: text, required: false, hint: 'Shown on Contact, Home and Patient information, e.g. "Free street parking on Brynner Street." Leave blank until confirmed.' }
          - { name: access, label: Accessibility, widget: text, required: false, hint: 'E.g. steps, ramps, wheelchair access. Shown on Patient information. Leave blank until confirmed.' }
      - name: policies
        label: Policies and timetable
        file: site/src/data/policies.json
        format: json
        fields:
          - name: classSteps
            label: How to start classes (one line per step)
            widget: list
            min: 1
            max: 4
            hint: Shown on the Pilates page.
          - name: timetable
            label: Class timetable
            label_singular: class
            widget: list
            required: false
            hint: Leave empty until it’s ready; the Pilates page shows a note instead.
            summary: '{{fields.day}} {{fields.time}}'
            fields:
              - name: day
                label: Day
                widget: select
                options: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
              - { name: time, label: Time, widget: string, hint: 'E.g. "6:00am".' }
              - { name: class, label: Class, widget: string, required: false, hint: 'Leave blank for a small group exercise class. Fill in only for a different kind of class.' }
              - { name: with, label: With, widget: string, required: false }
          - name: cancellation
            label: Cancellation policy
            widget: object
            fields:
              - { name: paragraphs, label: Paragraphs, label_singular: paragraph, widget: list, field: { name: paragraph, label: Paragraph, widget: text } }
          - name: classFacts
            label: Class facts
            label_singular: fact
            widget: list
            summary: '{{fields.label}}: {{fields.value}}'
            fields:
              - { name: label, label: Label, widget: string }
              - { name: value, label: Value, widget: string }
          - { name: equipment, label: Studio equipment, widget: list }
          - name: studioEtiquette
            label: Before you come to class
            label_singular: tip
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Title, widget: string }
              - { name: detail, label: Detail, widget: text }
          - name: booking
            label: Booking notes
            widget: object
            fields:
              - { name: classes, label: Booking classes, widget: text }
              - { name: bookingCode, label: Booking code tip, widget: text }
              - { name: waitlistText, label: Waitlist text, widget: string }
      - name: needs
        label: What can we help with?
        file: site/src/data/needs.json
        format: json
        fields:
          - name: needs
            label: Groups
            label_singular: group
            widget: list
            hint: The groups on the home page and the Services page. Conditions are clinical wording, so changes need owner approval.
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Title, widget: string }
              - { name: short, label: Short label (home page tile), widget: string }
              - name: icon
                label: Icon
                widget: select
                options:
                  - { label: Pulse (injuries and pain), value: activity }
                  - { label: Baby (pregnancy), value: baby }
                  - { label: Heart, value: heart }
                  - { label: Circular arrows (dizziness), value: spin }
                  - { label: Sprout (healthy ageing), value: sprout }
                  - { label: Dumbbell (strength), value: dumbbell }
                  - { label: Shield, value: shield }
                  - { label: Tick, value: check }
              - { name: examples, label: Conditions, widget: list }
              - name: services
                label: Services that help
                widget: relation
                collection: services
                value_field: '{{slug}}'
                search_fields: [title]
                display_fields: [title]
                multiple: true
              - { name: id, label: Link name, widget: string, required: false, pattern: ['^[a-z0-9-]+$', 'Lower-case letters, numbers and hyphens only, e.g. pregnancy-and-after'], hint: 'Used in links from the home page tiles. Leave blank on a new group and the site makes one from the title. Changing an existing one breaks links to it.' }
